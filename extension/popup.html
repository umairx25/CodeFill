<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CodeFill</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main>
    <header>
      <div class="brand" style="display:inline-flex; align-items:center; gap:0.5rem; line-height:1;"><img src="assets/icon.ico" alt="CodeFill app icon, a rounded blue square with a white terminal cursor and subtle coding-inspired accents, presented on a light background and used as the extension branding" style="width:20px; height:auto; display:block;">CodeFill</div><button id="scan"
        class="icon-button" type="button" aria-label="Scan again" title="Scan again"><svg viewBox="0 0 24 24"
          aria-hidden="true">
          <path d="M20 11a8 8 0 1 0-2.34 5.66M20 4v7h-7" />
        </svg></button>
    </header>
    <section id="loading" class="state" aria-live="polite"><span class="spinner" aria-hidden="true"></span>
      <div>
        <h1>Looking for a code</h1>
        <p id="status">Checking emails…</p>
      </div>
    </section>
    <section id="result" class="state result" hidden>
      <p class="label">Verification code</p>
      <div class="code-row">
        <span id="code" class="code"></span>
        <button id="copy" class="copy-button" type="button" aria-label="Copy verification code" title="Copy verification code">
          <svg id="copy-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="8" y="8" width="12" height="12" rx="2" />
            <path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2" />
          </svg>
          <svg id="fill-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" hidden><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M8 12h8m-3-3 3 3-3 3"/></svg>
          <span>Copy</span>
        </button>
      </div>
      <p class="sender"><strong>From:</strong> <span id="sender"></span></p>
      <p id="copied" class="copied" role="status"></p>
    </section>
    <section id="empty" class="state" hidden>
      <div>
        <h1 id="empty-title">No code found</h1>
        <p id="empty-message">No likely verification code appeared in your latest emails.</p>
      </div>
    </section>
  </main>
  <footer class="privacy"><span>© 2026 CodeFill · <a href="https://github.com/umairx25/CodeFill/blob/main/privacy.md" target="_blank" rel="noopener noreferrer">Privacy policy</a></span>
    <div class="settings-wrap">
      <button id="settings" class="icon-button" type="button" aria-label="Settings" title="Settings" aria-expanded="false" aria-controls="settings-panel">
        <!-- <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3" fill="currentColor"/><circle cx="15" cy="17" r="3" fill="currentColor"/></svg> -->
        <svg xmlns="http://w3.org" viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
  <path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.07-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.3L5.24,5.34C5.02,5.27,4.77,5.34,4.65,5.56L2.73,8.88 c-0.11,0.2-0.06,0.47,0.12,0.61l2.03,1.58c-0.05,0.3-0.07,0.62-0.07,0.94s0.02,0.64,0.07,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0.01,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.47-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/>
</svg>

      </button>
      <fieldset id="settings-panel" class="settings-panel" hidden>
        <legend>When a code is found</legend>
        <label><input type="radio" name="mode" value="copy" checked> Copy code</label>
        <label><input type="radio" name="mode" value="autofill"> Autofill code</label>
        <p>Autofill falls back to copying if no suitable field is found.</p>
        <p id="settings-status" role="status"></p>
      </fieldset>
    </div>
  </footer>
  <script type="module" src="popup.js"></script>
</body>

</html>
